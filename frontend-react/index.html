<!doctype html>
<html lang="en">
  <head>
    <!-- Basic Meta -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Title & Description -->
    <title>Cosmic News – Space AI-powered RSS Aggregator</title>
    <meta
      name="description"
      content="Cosmic News is an AI-powered RSS aggregator that rewrites space-related news into clear and engaging stories."
    />
    <meta
      name="keywords"
      content="space news, AI news, RSS aggregator, rewritten news, cosmic updates"
    />

    <!-- Canonical -->
    <link rel="canonical" href="https://cosmic-news.example.com/" />

    <!-- Favicon & Icons -->
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://cosmic-news.example.com/" />
    <meta property="og:title" content="Cosmic News – Space AI-powered RSS Aggregator" />
    <meta
      property="og:description"
      content="Follow rewritten AI-powered space news collected from multiple sources in one cosmic place."
    />
    <meta property="og:image" content="https://cosmic-news.example.com/og-image.jpg" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://cosmic-news.example.com/" />
    <meta name="twitter:title" content="Cosmic News – Space AI-powered RSS Aggregator" />
    <meta
      name="twitter:description"
      content="Stay updated with rewritten AI-powered space RSS news in one place."
    />
    <meta name="twitter:image" content="https://cosmic-news.example.com/og-image.jpg" />

    <!-- Structured Data (JSON-LD for Google) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "NewsMediaOrganization",
        "name": "Cosmic News",
        "url": "https://cosmic-news.example.com/",
        "logo": "https://cosmic-news.example.com/logo.png",
        "sameAs": [
          "https://twitter.com/cosmicnews",
          "https://facebook.com/cosmicnews"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
