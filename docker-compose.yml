version: '3.8'

services:
  mongodb:
    image: mongo:latest
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  news_api:
    build:
      context: .
      dockerfile: news_api/Dockerfile
    env_file:
      - ./.env
    ports:
      - "8000:8000"
    depends_on:
      - mongodb
    volumes:
      - /home/godfreynotsmart/llama.cpp/models:/models:ro

  moderation_service:
    build:
      context: .
      dockerfile: moderation_service/Dockerfile
    env_file:
      - ./.env
    ports:
      - "8002:8002"
    depends_on:
      - mongodb
    # Mount local torch/detoxify cache so Detoxify doesn't download checkpoints at runtime
    volumes:
    - /home/godfreynotsmart/.cache/torch/hub/checkpoints:/root/.cache/torch/hub/checkpoints
    

  rss_fetcher:
    build:
      context: .
      dockerfile: rss_fetcher/Dockerfile
    env_file:
      - ./.env
    depends_on:
      - mongodb
      - moderation_service
    environment:
      # the rss_fetcher will call this URL to clean titles
      MODERATION_SERVICE_URL: "http://moderation_service:8002"
    volumes:
      - /home/godfreynotsmart/llama.cpp/models:/models:ro

  frontend:
    build: ./frontend-react
    env_file:
      - ./.env
    environment:
      VITE_NEWS_API_URL: ${VITE_NEWS_API_URL}
      VITE_CATEGORIES_API_URL: ${VITE_CATEGORIES_API_URL}
    ports:
      - "5173:5173"
    depends_on:
      - news_api

volumes:
  mongo_data:
